name: Windows tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Automation/requirements.lock
      - name: Install restic
        run: choco install restic --version 0.18.1 --yes --no-progress
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement Automation/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --editable Automation
      - name: Run regression suite
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File Automation/run_tests.ps1
